[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --browser chromium
    --tracing retain-on-failure
    --output=reports/playwright-artifacts
    --html=reports/login_test_report.html
    --self-contained-html
    --slowmo 500
markers =
    smoke: validating the login test functionality
    regression: validating the all test cases functionalities
    api : Validating the API functionalities